[project]
name = "remarcable-assignment"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "django>=5.2,<6",
    "psycopg[binary]>=3.3.4",
]

[dependency-groups]
dev = [
    "ruff>=0.15.21",
]

[tool.ruff.lint]
extend-select = [
    "I",
    "UP",
    "B",
    "DJ",
]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*" = ["I", "UP"]
